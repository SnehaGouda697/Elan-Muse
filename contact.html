<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="contact.css">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header>

    <h1 class="logo">Élan Muse 🎀</h1>

    <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="main-navigation">
        <span></span><span></span><span></span>
    </button>

    <nav class="navbar" id="main-navigation" aria-label="Main navigation">
        <a href="home.html">Home</a>
        <a href="fashion.html">Fashion</a>
        <a href="beauty.html">Beauty</a>
        <a href="journal.html">Journal</a>
        <a href="contact.html">Contact</a>
    </nav>
  </header>

    <section class="contact">

    <h1>Let's Connect</h1>

    <p>
        Whether it's a collaboration, partnership,
        or just a friendly hello, I'd love to hear from you.
    </p>

</section>

<section class="contact-form">

    <form id="contact-form">

        <input type="text" name="name" placeholder="Your Name" aria-label="Your name" required>

        <input type="email" name="email" placeholder="Your Email" aria-label="Your email" required>

        <textarea name="message" placeholder="Your Message" aria-label="Your message" required></textarea> <br> <br>

        <button type="submit">Send Message</button>

    </form>
    <p id="form-status" role="status" aria-live="polite"></p>

</section>

<section class="social">

    <h2>Follow Me</h2>

    <p>Instagram • Pinterest • YouTube • LinkedIn</p>

</section>

<script src="site.js"></script>
</body>
</html>
